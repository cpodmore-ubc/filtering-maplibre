<!DOCTYPE html>
<html>

  <head>
    <meta charset="utf-8" />
    <title>Hover: a popup at the tree the mouse is over</title>

    <!-- Load MapLibre's stylesheet (CSS). Its code (JavaScript) is loaded below, in the script. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css"
    />
  </head>

  <body>
    <!-- The web map will go in this div element. -->
    <div id="mapid" style="width: 600px; height: 400px;"></div>

    <!-- Two buttons and a text box below the map. The buttons do nothing until JavaScript listens to them. -->
    <div id="controls" style="margin: 15px;">
      <button id="showAllFeaturesButton"> Show All Trees </button>

      <span style="display: inline-block; width: 30px;"></span>
      <input type="text" id="highlightFeaturesTextEntry" placeholder="e.g. Ornamental">
      <button id="highlightFeaturesButton">Highlight</button>
    </div>

    <script type="module">
      // Load MapLibre's code (JavaScript). Version 6 is loaded as a module, with import.
      import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';

      // Make a map with new maplibregl.Map(), and keep it in the variable map.
      const map = new maplibregl.Map({
        container: 'mapid',                  // the id of the div above
        center: [-123.256113, 49.265637],    // [longitude, latitude]
        zoom: 15,
        style: 'https://tiles.openfreemap.org/styles/positron'   // a ready-made style from OpenFreeMap
      });

      // A module keeps its names to itself. This line lets you type map in the console under the code.
      window.map = map;

      // The raw URL of the UBC Campus Water Features file on GitHub.
      const url = 'https://raw.githubusercontent.com/UBCGeodata/ubc-geospatial-opendata/refs/heads/master/ubcv/landscape/geojson/ubcv_municipal_waterfeatures.geojson' 

      // Paint properties set how the layer draws each circle.
      // They are kept in a variable, waterFeaturesPaint.

  const waterFeaturesPaint = {
        // A zoom expression: the radius depends on the map's zoom (as in step 8).
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 13, 1, 17, 6],
        // A data-driven expression: the colour depends on each water feature's SUB_TYPE value.
        // 'null' gives grey. 'Ornamental' gives light blue, 'Storm/Ornamental' gives
		// dark blue, 'Storm' gives purple', 'Research' gives green. Any other value, or no value, gives black.
        'circle-color': ['match', ['get', 'SUB_TYPE'],
						'null', '#808080', 
                         'Ornamental', '#8eedee',
                         'Storm/Ornamental', '#297bd5',
						 'Storm', '#c271ee', 
						 'Research', '#53e99d', 
                         '', '#000000'],
        'circle-opacity': 0.8
      };

      // When someone clicks a water feature on the map, MapLibre runs this function.
      // e holds information about the click. e.features[0] is the feature (the water feature) that was clicked.
      function waterFeaturePopup(e) {
        // water_features holds that feature's attributes, such as SUB_TYPE
        const water_features = e.features[0].properties;
        // Does this water feature have a SUB_TYPE (its use)? If it does not, no popup opens.
        if (water_features.SUB_TYPE) {
          const popup = new maplibregl.Popup();
          popup.setLngLat(e.lngLat);
          popup.setText(water_features.SUB_TYPE);
          popup.addTo(map);
        }
      }

      // addWaterFeatures adds the source, the layer and the click listener.
      function addWaterFeatures() {
        // If the features are already on the map, stop here.
        // MapLibre cannot add a second source with the same name.
        if (map.getSource('water_features')) {
          return;   // don't add water features twice
        }

        // A source holds the data. data: is the raw URL, so MapLibre fetches the file itself.
        // The trees appear when the whole file has arrived. Meanwhile, the browser goes on to map.addLayer() straight away.
        // attribution is the credit in the map's corner.
        map.addSource('water_features', {
          type: 'geojson',
          data: url,
          attribution: 'Water Features: UBC Campus Water Features, UBCGeodata'
        });

        // A layer says how to draw a source: here, a circle for each water feature.
        // source: 'water_features' is the name that addSource gave the source above.
        map.addLayer({
          id: 'water_features-circles',
          type: 'circle',
          source: 'water_features',
          paint: waterFeaturesPaint
        });

        // When a circle of the layer 'water_features-circles-circles' is clicked, MapLibre runs waterFeaturePopup.
        // Write waterFeaturePopup without (). MapLibre runs it later, once for each click.
        map.on('click', 'water_features-circles', waterFeaturePopup);

        // When the mouse moves over a water feature, MapLibre runs hoverFeature.
        // When the mouse leaves a water feature, MapLibre runs leaveFeature.
        map.on('mousemove', 'water_features-circles', hoverFeature);
        map.on('mouseleave', 'water_features-circles', leaveFeature);
      }

      // Show All Features: draw every water feature.
      function showAllFeatures() {
        addFeatures();
        // A filter of null means no filter: every feature is drawn.
        map.setFilter('water_features-circles', null);
        // Back to the colour and the opacity in waterFeaturesPaint.
        // waterFeaturesPaint['circle-color'] is the 'circle-color' value inside waterFeaturesPaint.
        // A name with a hyphen is written this way: in square brackets and quotes.
        map.setPaintProperty('water_features-circles', 'circle-color', waterFeaturesPaint['circle-color']);
        map.setPaintProperty('water_features-circles', 'circle-opacity', waterFeaturesPaint['circle-opacity']);
      }

      // One popup, used again each time the mouse moves over a water feature.
      const hoverPopup = new maplibregl.Popup({ closeButton: false });

      function hoverFeature(e) {
        const water_features = e.features[0].properties;
        // A water feature with no SUB_TYPE gets no popup.
        if (water_features.SUB_TYPE) {
          hoverPopup.setLngLat(e.features[0].geometry.coordinates);
          hoverPopup.setText(water_features.SUB_TYPE);
          hoverPopup.addTo(map);
        } else {
          hoverPopup.remove();
        }
      }

      function leaveFeature() {
        hoverPopup.remove();
      }

      // Highlight: keep every water feature on the map. Colour the water features whose SUB_TYPE contains the text entered into the text box.
      function highlightFeatures() {
        addFeatures();
        // .value is the text that is in the box when the button is clicked.
        const textEntry = document.getElementById('highlightFeaturesTextEntry');
        const typeToHighlight = textEntry.value;
        if (typeToHighlight === '') {
          showAllFeatures();
          return;
        }
        // No filter: every water feature is drawn.
        map.setFilter('water_features-circles', null);
        // ['in', text, ['get', 'SUB_TYPE']] is true when the text appears in the water feature's SUB_TYPE.
        const matches = ['in', typeToHighlight, ['get', 'SUB_TYPE']];
        // A case expression: MapLibre checks matches for each water feature.
        // If it is true, the water feature gets the first value. If it is false, the water feature gets the second value.
        map.setPaintProperty('water_features-circles', 'circle-color', ['case', matches, '#808080', '#8eedee', '#297bd5', '#c271ee', '#53e99d', '#000000']);
        map.setPaintProperty('water_features-circles', 'circle-opacity', ['case', matches, 0.8]);
      }

      // Listen to the buttons only after the map's style has loaded.
      map.on('load', function () {
        // Two listeners: each button runs its own function when it is clicked.
        // Write the function names without (). The browser runs them later, once for each click.
        const showAllButton = document.getElementById('showAllFeaturesButton');
        showAllButton.addEventListener('click', showAllFeatures);
        const highlightButton = document.getElementById('highlightFeaturesButton');
        highlightButton.addEventListener('click', highlightFeatures);
      });
    </script>
  </body>
</html>
